name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.0"
            xcode: "16.0"
            macos: "15"
            runner: macos-15
          - swift: "6.1"
            xcode: "16.3"
            macos: "15"
            runner: macos-15
          - swift: "6.2"
            xcode: "26.0"
            macos: "26"
            runner: macos-26
          - swift: "6.3"
            xcode: "26.6"
            macos: "26"
            runner: macos-26
          - swift: "6.4"
            xcode: "27.0"
            macos: "27"
            runner: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Lint Swift
        run: make lint-swift

      - name: Lint C/C++ (clang-format)
        if: ${{ matrix.xcode == '26.0' }}
        run: make lint-cpp
        env:
          CLANG_FORMAT: xcrun clang-format

      - name: Build
        run: make build

      - name: Test
        run: make test
